<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – adventskalender</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f3f1ec; color: #222; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; }
  .box { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  input[type=password], textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid #bbb; border-radius: 8px; }
  textarea { min-height: 90px; resize: vertical; }
  button { font: 600 .95rem system-ui; padding: 9px 16px; border: 0; border-radius: 8px; background: #b3202f; color: #fff; cursor: pointer; }
  button.sec { background: #e5e1d8; color: #222; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .row .grow { flex: 1; }
  .err { color: #b3202f; margin-top: 8px; }
  .ok { color: #1c7a3a; font-size: .9rem; }
  .day { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .day b { font-size: 1.1rem; }
  .tag { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: #ddd; }
  .tag.open { background: #cdeed7; }
  .sticky { position: sticky; top: 0; background: #f3f1ec; padding: 8px 0; z-index: 2; }
  small { color: #666; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎄 Admin – Jorunns adventskalender</h1>

  <div class="box" id="tip" hidden>
    <b>Lenker:</b> skriv <code>[KLIKK HER](https://www.google.com)</code> – da vises «KLIKK HER» som en lenke.
    En vanlig adresse som <code>https://www.google.com</code> blir også en lenke. Bare http/https støttes.
  </div>

  <div class="box" id="login">
    <label for="pw">Passord</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="row"><button id="loginBtn">Logg inn</button></div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="editor" hidden>
    <div class="sticky box row">
      <span class="grow" id="info"></span>
      <button id="saveAll">Lagre alle</button>
      <button class="sec" id="logout">Logg ut</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let pw = '';
  let unlocked = 0;
  const hdr = () => ({ 'Content-Type': 'application/json', 'x-admin-password': pw });

  async function login(p) {
    const r = await fetch('/api/admin/messages', { headers: { 'x-admin-password': p } });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || 'Innlogging feilet');
    }
    return r.json();
  }

  function render(data) {
    unlocked = data.unlocked;
    $('info').textContent = `Åpne luker i dag: ${unlocked} av 24`;
    const list = $('list'); list.innerHTML = '';
    for (let n = 1; n <= 24; n++) {
      const box = document.createElement('div'); box.className = 'box';
      const link = location.origin + '/?luke=' + n;
      box.innerHTML = `
        <div class="day"><b>Luke ${n}</b><span class="tag ${n <= unlocked ? 'open' : ''}">${n <= unlocked ? 'kan åpnes nå' : 'åpner ' + n + '. des'}</span></div>
        <textarea data-n="${n}" maxlength="5000"></textarea>
        <div class="row">
          <button data-save="${n}">Lagre</button>
          <button class="sec" data-copy="${n}">Kopier lenke</button>
          <a href="${link}" target="_blank" rel="noopener"><small>${link}</small></a>
          <span class="ok" data-msg="${n}"></span>
        </div>`;
      box.querySelector('textarea').value = data.messages[n] || '';
      list.appendChild(box);
    }
  }

  async function save(nums) {
    const messages = {};
    nums.forEach(n => messages[n] = document.querySelector(`textarea[data-n="${n}"]`).value);
    const r = await fetch('/api/admin/messages', { method: 'PUT', headers: hdr(), body: JSON.stringify({ messages }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Lagring feilet');
    nums.forEach(n => {
      const m = document.querySelector(`[data-msg="${n}"]`); m.textContent = '✓ Lagret';
      setTimeout(() => m.textContent = '', 2500);
    });
  }

  $('list').addEventListener('click', async e => {
    const s = e.target.dataset.save, c = e.target.dataset.copy;
    try {
      if (s) await save([s]);
      if (c) { await navigator.clipboard.writeText(location.origin + '/?luke=' + c); e.target.textContent = 'Kopiert!'; setTimeout(() => e.target.textContent = 'Kopier lenke', 1500); }
    } catch (err) { alert(err.message); }
  });
  $('saveAll').addEventListener('click', async () => {
    try { await save(Array.from({ length: 24 }, (_, i) => i + 1)); alert('Alle luker lagret'); } catch (err) { alert(err.message); }
  });
  $('logout').addEventListener('click', () => { pw = ''; sessionStorage.removeItem('adm'); location.reload(); });

  async function start(p) {
    try {
      const data = await login(p);
      pw = p; try { sessionStorage.setItem('adm', p); } catch {}
      $('login').hidden = true; $('editor').hidden = false; $('tip').hidden = false; render(data);
    } catch (e) { $('loginErr').textContent = e.message; }
  }
  $('loginBtn').addEventListener('click', () => start($('pw').value));
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') start($('pw').value); });
  let saved = null; try { saved = sessionStorage.getItem('adm'); } catch {}
  if (saved) start(saved);
})();
</script>
</body>
</html>
